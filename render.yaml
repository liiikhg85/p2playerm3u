services:
  - type: web
    name: p2player-proxy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: FTP_HOST
        value: ftpupload.net
      - key: FTP_PORT
        value: "21"
      - key: FTP_USER
        value: if0_42448464
      - key: FTP_PASSWORD
        sync: false
      - key: FTP_USERS_PATH
        value: /htdocs/usuarios.json
      - key: FTP_SERVERS_PATH
        value: /htdocs/servidores/servidores.json
      - key: ACCESS_TOKEN
        value: p2player2026
      - key: USERS_CACHE_SECONDS
        value: "30"
      - key: SERVERS_CACHE_SECONDS
        value: "15"
      - key: API_CACHE_SECONDS
        value: "60"
